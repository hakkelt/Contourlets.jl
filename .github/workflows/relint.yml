name: ReLint

on:
  push:
    branches:
      - master
    paths:
      - "src/**/*.jl"
      - "scripts/relint.jl"
      - ".github/workflows/relint.yml"
  pull_request:
    paths:
      - "src/**/*.jl"
      - "scripts/relint.jl"
      - ".github/workflows/relint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  relint:
    name: ReLint static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2

      - name: Install ReLint
        run: |
          julia --startup-file=no -e '
            import Pkg
            Pkg.activate("relint"; shared=true)
            Pkg.add(url="https://github.com/RelationalAI-oss/ReLint.jl")
          '

      - name: Run ReLint
        run: |
          JULIA_LOAD_PATH="@relint:@stdlib" julia --startup-file=no scripts/relint.jl src/
